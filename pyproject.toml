[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecal-measurement-analysis"
version = "0.1.0"
description = "TDD-first tooling for eCAL recording timestamp and drop analysis"
requires-python = ">=3.10"
dependencies = [
  "eclipse-ecal>=6.0",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
