[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecal-measurement-analysis"
version = "0.1.0"
description = "TDD-first tooling for eCAL recording timestamp and drop analysis"
requires-python = ">=3.10"
dependencies = [
  "eclipse-ecal>=6.0",
  "pyarrow>=16.0",
  "matplotlib>=3.8",
]


[project.scripts]
ecal-measurement-analysis = "ecal_measurement_analysis.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
